name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: build and test (${{ matrix.name }})
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: fedora
            image: fedora:44
            deps: dnf install -y git cmake gcc-c++ make qt6-qtbase-devel qt6-qtdeclarative-devel qt6-qttools-devel mesa-libGL-devel
          - name: ubuntu-24.04
            image: ubuntu:24.04
            deps: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y git cmake g++ make qt6-base-dev qt6-declarative-dev qt6-tools-dev qt6-l10n-tools libgl1-mesa-dev qml6-module-qtquick qml6-module-qtquick-window qml6-module-qtqml-workerscript
          - name: debian-13
            image: debian:13
            deps: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y git cmake g++ make qt6-base-dev qt6-declarative-dev qt6-tools-dev qt6-l10n-tools libgl1-mesa-dev qml6-module-qtquick qml6-module-qtquick-window qml6-module-qtqml-workerscript
          - name: arch
            image: archlinux:latest
            deps: pacman -Syu --noconfirm git cmake gcc make qt6-base qt6-declarative qt6-tools
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install dependencies
        run: ${{ matrix.deps }}
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j"$(nproc)"
      - name: Test
        run: ctest --test-dir build --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen
