name: Release assets

# Release-please creates the v* tag and the GitHub release with the notes; this builds and tests the rpm, deb, pkg and tar.gz for
# that tag and attaches them to it, with checksums and a build provenance attestation. Run it by hand to just build them (the
# packages are kept as run artifacts and nothing is published). The tag starts it because release-please runs with CI_PUSH_TOKEN.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: package (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: fedora
            image: fedora:44
            generators: "RPM;TGZ"
            deps: dnf install -y git cmake gcc-c++ make rpm-build qt6-qtbase-devel qt6-qtdeclarative-devel qt6-qttools-devel mesa-libGL-devel
          - name: ubuntu-24.04
            image: ubuntu:24.04
            generators: DEB
            deps: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y git cmake g++ make dpkg-dev file qt6-base-dev qt6-declarative-dev qt6-tools-dev qt6-l10n-tools libgl1-mesa-dev qml6-module-qtquick qml6-module-qtquick-window qml6-module-qtqml-workerscript
          - name: debian-13
            image: debian:13
            generators: DEB
            deps: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y git cmake g++ make dpkg-dev file qt6-base-dev qt6-declarative-dev qt6-tools-dev qt6-l10n-tools libgl1-mesa-dev qml6-module-qtquick qml6-module-qtquick-window qml6-module-qtqml-workerscript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install dependencies
        run: ${{ matrix.deps }}
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON
          cmake --build build -j"$(nproc)"
      - name: Test
        run: ctest --test-dir build --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Package
        run: |
          version=$(sed -n 's/^project(HuenicornCompanion VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          cd build
          cpack -G "${{ matrix.generators }}"
          mkdir ../dist
          for f in *.rpm *.deb *.tar.gz; do
            [ -e "$f" ] || continue
            case "$f" in
              *.deb) cp "$f" "../dist/huenicorn-companion-$version-${{ matrix.name }}.deb" ;;
              *.rpm) cp "$f" "../dist/huenicorn-companion-$version-${{ matrix.name }}.rpm" ;;
              *) cp "$f" ../dist/ ;;
            esac
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.name }}
          path: dist/*

  package-arch:
    name: package (arch)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: archlinux:latest
    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm git base-devel cmake qt6-base qt6-declarative qt6-tools
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build package
        run: |
          version=$(sed -n 's/^project(HuenicornCompanion VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          useradd -m builder
          mkdir /home/builder/pkg
          cp packaging/arch/PKGBUILD /home/builder/pkg/
          tar czf "/home/builder/pkg/huenicorn-companion-$version.tar.gz" \
            --exclude=.git --exclude=build --transform "s,^\./,huenicorn-companion-$version/," .
          chown -R builder /home/builder/pkg
          su builder -c "cd ~/pkg && HUENICORN_VERSION=$version makepkg -f --noconfirm"
          mkdir dist
          cp /home/builder/pkg/*.pkg.tar.zst "dist/huenicorn-companion-$version-arch.pkg.tar.zst"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-arch
          path: dist/*

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [package, package-arch]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write # mint the provenance attestation
      attestations: write
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The packages are built from the tagged commit, so its version has to be the tag's version.
      - name: Check the tag matches the version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^project(HuenicornCompanion VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          if [ "v$version" != "$TAG" ]; then echo "::error::Tag $TAG does not match the CMake version $version"; exit 1; fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: release-assets
          merge-multiple: true
      - name: Checksums
        run: |
          set -euo pipefail
          cd release-assets
          ls -l
          sha256sum huenicorn-companion-* > SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-assets/huenicorn-companion-*
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" release-assets/* --clobber --repo "$GITHUB_REPOSITORY"
