name: Release PR

# Keeps one open pull request on master that bumps the version in CMakeLists.txt. Merging it creates the v* tag and the
# GitHub release with the notes sorted by commit type; the tag starts release.yml, which attaches the packages.
# It runs with CI_PUSH_TOKEN: tags and pull requests made by GITHUB_TOKEN start no workflows, so the checks and the build would never run.
on:
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.CI_PUSH_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
